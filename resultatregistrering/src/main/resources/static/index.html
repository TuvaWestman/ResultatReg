



<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapportera endast betyg – Ladok</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            color: #2d3b45;
            padding: 30px;
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 14px;
            color: #555;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .top-controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            flex: 1;
        }

        .control-group label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }

        select, input[type="date"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #c7cdd1;
            border-radius: 4px;
            font-size: 14px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 10px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .action-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .btn {
            padding: 8px 14px;
            border: 1px solid #c7cdd1;
            background: #f5f5f5;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn:hover {
            background: #e8e8e8;
        }

        .btn-primary {
            background: #0073b1;
            color: white;
            border: none;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: #005a8c;
        }

        .transfer-box {
            border: 1px solid #c7cdd1;
            padding: 10px;
            border-radius: 4px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .selected-count {
            text-align: right;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 2px solid #c7cdd1;
            font-size: 13px;
            color: #333;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        tr:hover {
            background-color: #f9fbfd;
        }

        .status-ok {
            color: #0b874b;
            font-weight: bold;
        }

        .status-err {
            color: #d93025;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Rapportera endast betyg</h2>

    <p class="subtitle">
        Tre urvalsfält visas: Kurskod, Uppgift i Canvas och Modul i Ladok.
        Välj enligt det du vill rapportera.
    </p>

    <div class="top-controls">

        <div class="control-group">
            <label for="courseSelect">Kurskod</label>
            <select id="courseSelect" onchange="loadModules(); clearResults()">
                <option value="">-</option>
            </select>
        </div>

        <div class="control-group">
            <label for="assignmentSelect">Uppgift i Canvas</label>
            <select id="assignmentSelect" onchange="clearResults()">
                <option value="Inlämningsuppgift 1">Inlämningsuppgift 1</option>
                <option value="Slutprojekt">Slutprojekt</option>
                <option value="Tentamen">Tentamen</option>
            </select>
        </div>

        <div class="control-group">
            <label for="moduleSelect">Modul i Ladok</label>
            <select id="moduleSelect" onchange="clearResults()">
                <option value="">-</option>
            </select>
        </div>

    </div>
    
    <div style="text-align: right; margin: -14px 0 24px;">
    <button class="btn btn-primary"
            type="button"
            onclick="showResults()">
        Visa
    </button>
</div>

    <div class="action-bar">

        <div class="action-group">
            <label>Markera</label>
            <button class="btn" onclick="selectRows('all')">Alla</button>
            <button class="btn" onclick="selectRows('graded')">Betygsatta</button>
            <button class="btn" onclick="selectRows('none')">Inga</button>
        </div>

        <div class="action-group">
            <label>Datum för markerade</label>

            <div style="display: flex; gap: 5px;">
                <input type="date" id="bulkDate" style="width: 150px;">
                <button class="btn" onclick="applyBulkDate()">Sätt datum</button>
            </div>
        </div>

        <div class="transfer-box">
            <select id="actionType" style="width: auto;">
                <option value="overfor">Överför till Ladok</option>
            </select>

            <button class="btn btn-primary" onclick="transferSelected()">
                Överför
            </button>
        </div>

    </div>

    <div class="selected-count" id="selectedCount">
        Antal markerade: 0
    </div>

    <table>

        <thead>
        <tr>
            <th style="width: 30px;">
                <input type="checkbox" id="masterCheck" onclick="toggleAll(this)">
            </th>
            <th>Namn (Användarnamn / Pnr)</th>
            <th>Omdöme i Canvas</th>
            <th>Betyg i Ladok</th>
            <th>Examinationsdatum</th>
            <th>Status</th>
            <th>Information</th>
        </tr>
        </thead>

        <tbody id="studentTableBody">
        <tr>
            <td colspan="7">Välj kurs och modul och klicka på Visa.</td>
        </tr>
        </tbody>

    </table>

</div>

<script>

    let allModules = [];

window.onload = async function() {
    await loadCourses();
    await fetchAllModules();
    clearResults();
};


    // Hämta alla kurser från Epok

    async function loadCourses() {
        const res = await fetch('/api/courses');

        if (!res.ok) {
            throw new Error('Kunde inte hämta kurser');
        }

        const courses = await res.json();

        const select = document.getElementById('courseSelect');

        select.innerHTML = '<option value="">-</option>';

        courses.forEach(c => {
            select.innerHTML += `
                <option value="${c.courseCode}">
                    ${c.courseCode} - ${c.courseName}
                </option>
            `;
        });
    }


    // Hämta alla moduler

    async function fetchAllModules() {
        const res = await fetch('/api/modules');

        if (!res.ok) {
            throw new Error('Kunde inte hämta moduler');
        }

        allModules = await res.json();
    }


    // Visa moduler för vald kurs

    function loadModules() {
        const selectedCourse = document.getElementById('courseSelect').value;

        const select = document.getElementById('moduleSelect');

        select.innerHTML = '<option value="">-</option>';

        const filtered = allModules.filter(m =>
            m.courseCode === selectedCourse && m.active === true
        );

        filtered.forEach(m => {
            select.innerHTML += `
                <option value="${m.moduleCode}">
                    ${m.moduleCode} - ${m.moduleName} (${m.credits} hp)
                </option>
            `;
        });
    }


    // Hämta studenter

// Rensa tabellen
function clearResults() {
    document.getElementById('studentTableBody').innerHTML =
        '<tr><td colspan="7">Välj kurs och modul och klicka på Visa.</td></tr>';

    document.getElementById('masterCheck').checked = false;
    updateCount();
}

// Hämta och visa resultat från REST API
async function showResults() {

    const courseCode =
        document.getElementById('courseSelect').value;

    const assignment =
        document.getElementById('assignmentSelect').value;

    const moduleCode =
        document.getElementById('moduleSelect').value;

    if (!courseCode || !moduleCode) {
        alert('Välj kurs och modul först!');
        return;
    }

    const tbody = document.getElementById('studentTableBody');
    tbody.innerHTML =
        '<tr><td colspan="7">Hämtar resultat...</td></tr>';

    try {
        // Hämta student-, Canvas- och Ladok-data
        const canvasUrl = '/api/canvas/grades?' +
            new URLSearchParams({ courseCode, assignment });

        const responses = await Promise.all([
            fetch('/api/students'),
            fetch(canvasUrl),
            fetch('/api/results')
        ]);

        if (responses.some(r => !r.ok)) {
            throw new Error('Ett API svarade med fel');
        }

        const [students, canvasGrades, results] =
            await Promise.all(responses.map(r => r.json()));

        tbody.innerHTML = '';

        // Matcha omdömen och resultat med personnummer
        const canvasMap = new Map(
            canvasGrades.map(g => [g.personalNumber, g.grade])
        );

        const ladokMap = new Map();

        results
            .filter(r =>
                r.courseCode === courseCode &&
                r.moduleCode === moduleCode)
            .forEach(r => {
                const previous = ladokMap.get(r.personalNumber);
                if (!previous ||
                    r.examinationDate >= previous.examinationDate) {
                    ladokMap.set(r.personalNumber, r);
                }
            });

        // Visa studenter som har Canvas- eller Ladok-data
        const visibleStudents = students.filter(s =>
            canvasMap.has(s.personalNumber) ||
            ladokMap.has(s.personalNumber)
        );

        for (const s of visibleStudents) {

            const canvasGrade =
                canvasMap.get(s.personalNumber) || '';

            const ladok = ladokMap.get(s.personalNumber);
            const grade = ladok ? ladok.grade : canvasGrade;

            const row = document.createElement('tr');

            row.innerHTML = `
                <td>
                    <input type="checkbox" class="row-check"
                        data-pnr="${s.personalNumber}"
                        onchange="updateCount()"
                        ${ladok ? 'disabled' : ''}>
                </td>

                <td>
                    <strong>${s.lastName}, ${s.firstName}</strong>
                    <br>
                    <small>${s.username} | ${s.personalNumber}</small>
                </td>

                <td class="canvas-grade">
                    ${canvasGrade || '-'}
                </td>

                <td>
                    <select class="ladok-grade"
                        ${ladok ? 'disabled' : ''}>
                        <option value="">-</option>
                        <option value="U" ${grade === 'U' ? 'selected' : ''}>U</option>
                        <option value="G" ${grade === 'G' ? 'selected' : ''}>G</option>
                        <option value="VG" ${grade === 'VG' ? 'selected' : ''}>VG</option>
                    </select>
                </td>

                <td>
                    <input type="date" class="exam-date"
                        value="${ladok ? ladok.examinationDate : ''}"
                        ${ladok ? 'disabled' : ''}>
                </td>

                <td class="status-cell">
                    ${ladok ? 'Registrerad' : '-'}
                </td>

                <td class="info-cell">
                    ${ladok ? 'Finns redan i Ladok' : ''}
                </td>
            `;

            tbody.appendChild(row);
        }

        if (visibleStudents.length === 0) {
            tbody.innerHTML =
                '<tr><td colspan="7">Inga resultat hittades.</td></tr>';
        }

        document.getElementById('masterCheck').checked = false;
        updateCount();

    } catch (error) {
        console.error(error);
        tbody.innerHTML =
            '<tr><td colspan="7">Fel vid hämtning av resultat.</td></tr>';
    }
}

    // Markera alla studenter

    function toggleAll(master) {
        document.querySelectorAll('.row-check').forEach(cb => {
            cb.checked = master.checked;
        });

        updateCount();
    }


    // Markera studenter utifrån val

    function selectRows(type) {

        document.querySelectorAll('#studentTableBody tr').forEach(row => {

            const cb = row.querySelector('.row-check');
            const grade = row.querySelector('.ladok-grade').value;

            if (type === 'all') {
                cb.checked = true;
            }

            if (type === 'none') {
                cb.checked = false;
            }

            if (type === 'graded') {
                cb.checked = (grade !== '');
            }

        });

        updateCount();
    }


    // Uppdatera antal markerade

    function updateCount() {
        const count = document.querySelectorAll('.row-check:checked').length;

        document.getElementById('selectedCount').innerText =
            `Antal markerade: ${count}`;
    }


    // Sätt samma datum för markerade studenter

    function applyBulkDate() {

        const dateVal = document.getElementById('bulkDate').value;

        if (!dateVal) {
            return alert('Välj ett datum först!');
        }

        document.querySelectorAll('#studentTableBody tr').forEach(row => {

            if (row.querySelector('.row-check').checked) {
                row.querySelector('.exam-date').value = dateVal;
            }

        });
    }


    // Överför markerade resultat till Ladok

    async function transferSelected() {

        const courseCode = document.getElementById('courseSelect').value;

        const moduleCode = document.getElementById('moduleSelect').value;

        if (!courseCode || !moduleCode) {
            return alert('Välj både Kurskod och Modul i Ladok högst upp!');
        }

        const rows = document.querySelectorAll('#studentTableBody tr');

        for (let row of rows) {

            const cb = row.querySelector('.row-check');

            if (!cb || !cb.checked) {
                continue;
            }

            const personalNumber = cb.getAttribute('data-pnr');

            const grade = row.querySelector('.ladok-grade').value;

            const examinationDate = row.querySelector('.exam-date').value;

            const statusCell = row.querySelector('.status-cell');

            const infoCell = row.querySelector('.info-cell');


            if (!grade || !examinationDate) {

                statusCell.innerHTML =
                    '<span class="status-err">Hinder</span>';

                infoCell.innerText = 'Saknar betyg eller datum';

                continue;
            }


            try {

                const response = await fetch('/api/results', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        personalNumber,
                        courseCode,
                        moduleCode,
                        examinationDate,
                        grade
                    })

                });


                if (response.ok) {

                    const data = await response.json();

                    statusCell.innerHTML =
                        `<span class="status-ok">${data.status}</span>`;

                    infoCell.innerText = 'Överförd till Ladok';

                    cb.checked = false;

                } else {

                    statusCell.innerHTML = 'HINDER';

                    infoCell.innerText = 'Kunde inte sparas (dubblett?)';

                }

            } catch (e) {

                statusCell.innerHTML = 'Fel';

                infoCell.innerText = 'Serverfel';

            }

        }

        updateCount();
    }

</script>

</body>
</html>
