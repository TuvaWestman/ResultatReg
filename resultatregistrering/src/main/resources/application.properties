
# APPLICATION
spring.application.name=resultatregistrering
server.port=8080

# MYSQL - EPOK
spring.datasource.url=jdbc:mysql://localhost:3306/epok_db
spring.datasource.username=root
spring.datasource.password=

app.datasource.studentits.url=jdbc:mysql://localhost:3306/studentits_db
app.datasource.studentits.username=root
app.datasource.studentits.password=

app.datasource.ladok.url=jdbc:mysql://localhost:3306/ladok_db
app.datasource.ladok.username=root
app.datasource.ladok.password=


# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Do not keep database sessions open during web rendering
spring.jpa.open-in-view=false
